# From Astro's GitHub Pages guide: https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  # Build and publish every time main is pushed
  push:
    branches: [main]
  # Also allow a manual run from the Actions tab on GitHub
  workflow_dispatch:

# Allow this workflow to read the repo and create a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
